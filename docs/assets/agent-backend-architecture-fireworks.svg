<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="title desc">
  <title id="title">Data Analysis Agent Backend Architecture</title>
  <desc id="desc">Architecture diagram for a FastAPI and LangChain data analysis agent backend.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 28px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 14px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .lane { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 8 6; rx: 18; }
      .lane-title { font: 700 15px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; letter-spacing: .2px; }
      .node { fill: #ffffff; stroke-width: 2; rx: 14; filter: url(#shadow); }
      .node-title { font: 700 15px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .node-sub { font: 400 12px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .small { font: 400 11px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #64748b; }
      .tag { font: 700 10px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #ffffff; }
      .api { stroke: #2563eb; }
      .agent { stroke: #7c3aed; }
      .data { stroke: #0891b2; }
      .llm { stroke: #16a34a; }
      .guard { stroke: #ea580c; }
      .flow { fill: none; stroke: #2563eb; stroke-width: 2.6; marker-end: url(#arrow-blue); }
      .dataflow { fill: none; stroke: #0891b2; stroke-width: 2.6; marker-end: url(#arrow-cyan); }
      .llmflow { fill: none; stroke: #16a34a; stroke-width: 2.6; marker-end: url(#arrow-green); }
      .repairflow { fill: none; stroke: #ea580c; stroke-width: 2.6; stroke-dasharray: 8 5; marker-end: url(#arrow-orange); }
      .eventflow { fill: none; stroke: #7c3aed; stroke-width: 2.6; stroke-dasharray: 4 4; marker-end: url(#arrow-purple); }
      .label { font: 700 11px Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #334155; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0891b2"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="760"/>
  <text x="60" y="54" class="title">通用数据分析 Agent 后端架构</text>
  <text x="60" y="80" class="subtitle">FastAPI 任务接口 + LangChain Agent 编排 + Schema 理解 + SQL 安全执行 + 流式业务洞察</text>

  <rect x="40" y="112" width="1120" height="96" class="lane"/>
  <text x="62" y="140" class="lane-title">Interface Layer</text>
  <rect x="90" y="154" width="180" height="70" class="node api"/>
  <text x="112" y="181" class="node-title">前端分析工作台</text>
  <text x="112" y="202" class="node-sub">Chat / Workspace / Task View</text>
  <rect x="354" y="154" width="190" height="70" class="node api"/>
  <text x="376" y="181" class="node-title">FastAPI Backend</text>
  <text x="376" y="202" class="node-sub">任务 API / CORS / OpenAPI</text>
  <rect x="628" y="154" width="200" height="70" class="node api"/>
  <text x="650" y="181" class="node-title">SSE Stream</text>
  <text x="650" y="202" class="node-sub">task / step / token / result</text>
  <rect x="920" y="154" width="178" height="70" class="node api"/>
  <text x="942" y="181" class="node-title">Task State</text>
  <text x="942" y="202" class="node-sub">messages / steps / lastRun</text>

  <rect x="40" y="252" width="1120" height="228" class="lane"/>
  <text x="62" y="280" class="lane-title">Agent Core Layer</text>
  <rect x="90" y="310" width="170" height="74" class="node agent"/>
  <text x="112" y="337" class="node-title">多轮追问改写</text>
  <text x="112" y="358" class="node-sub">history → standalone question</text>
  <rect x="310" y="310" width="170" height="74" class="node agent"/>
  <text x="332" y="337" class="node-title">Schema 理解</text>
  <text x="332" y="358" class="node-sub">字段画像 / 样例 / 类型</text>
  <rect x="530" y="310" width="170" height="74" class="node agent"/>
  <text x="552" y="337" class="node-title">表关联推理</text>
  <text x="552" y="358" class="node-sub">customer_id / product_id</text>
  <rect x="750" y="310" width="170" height="74" class="node agent"/>
  <text x="772" y="337" class="node-title">SQL 生成</text>
  <text x="772" y="358" class="node-sub">SELECT / WITH only</text>
  <rect x="970" y="310" width="150" height="74" class="node guard"/>
  <text x="992" y="337" class="node-title">安全闸门</text>
  <text x="992" y="358" class="node-sub">只读校验 + LIMIT</text>

  <rect x="245" y="412" width="170" height="74" class="node guard"/>
  <text x="267" y="439" class="node-title">SQL 自修复</text>
  <text x="267" y="460" class="node-sub">错误 + Schema + 原 SQL</text>
  <rect x="470" y="412" width="170" height="74" class="node agent"/>
  <text x="492" y="439" class="node-title">图表建议</text>
  <text x="492" y="460" class="node-sub">bar / line / bubble / table</text>
  <rect x="695" y="412" width="190" height="74" class="node agent"/>
  <text x="717" y="439" class="node-title">流式深度分析</text>
  <text x="717" y="460" class="node-sub">趋势 / 异常 / 建议</text>

  <rect x="40" y="525" width="710" height="150" class="lane"/>
  <text x="62" y="553" class="lane-title">Data &amp; Runtime Layer</text>
  <rect x="90" y="586" width="160" height="68" class="node data"/>
  <text x="112" y="612" class="node-title">数据源适配</text>
  <text x="112" y="632" class="node-sub">CSV / Excel / SQLite / MySQL</text>
  <rect x="315" y="586" width="160" height="68" class="node data"/>
  <text x="337" y="612" class="node-title">Schema Profile</text>
  <text x="337" y="632" class="node-sub">表 / 字段 / 关联候选</text>
  <rect x="540" y="586" width="160" height="68" class="node data"/>
  <text x="562" y="612" class="node-title">只读查询连接</text>
  <text x="562" y="632" class="node-sub">SQLite runtime DataFrame</text>

  <rect x="800" y="525" width="360" height="150" class="lane"/>
  <text x="822" y="553" class="lane-title">Model Layer</text>
  <rect x="850" y="586" width="250" height="68" class="node llm"/>
  <text x="872" y="612" class="node-title">OpenAI-compatible LLM</text>
  <text x="872" y="632" class="node-sub">OpenAI / DeepSeek / Qwen via env</text>

  <path d="M270 189 H346" class="flow"/>
  <text x="292" y="178" class="label">REST</text>
  <path d="M544 189 H620" class="flow"/>
  <text x="566" y="178" class="label">run</text>
  <path d="M828 189 H912" class="eventflow"/>
  <text x="848" y="178" class="label">persist</text>
  <path d="M628 206 C560 250 358 266 210 306" class="eventflow"/>
  <text x="430" y="248" class="label">stream task context</text>

  <path d="M260 347 H302" class="flow"/>
  <path d="M480 347 H522" class="flow"/>
  <path d="M700 347 H742" class="flow"/>
  <path d="M920 347 H962" class="flow"/>
  <path d="M1045 384 C1045 452 420 526 620 586" class="dataflow"/>
  <text x="775" y="512" class="label">safe SQL</text>
  <path d="M620 586 C660 540 622 500 575 486" class="dataflow"/>
  <text x="626" y="530" class="label">result rows</text>
  <path d="M540 449 H423" class="repairflow"/>
  <text x="444" y="438" class="label">error repair</text>
  <path d="M330 412 C360 382 720 393 970 365" class="repairflow"/>
  <text x="565" y="400" class="label">retry SQL</text>
  <path d="M640 449 H687" class="flow"/>
  <path d="M790 412 C805 388 835 386 835 384" class="flow"/>
  <path d="M885 449 C930 438 990 348 970 334" class="llmflow"/>
  <path d="M835 310 C835 258 920 235 966 586" class="llmflow"/>
  <text x="940" y="470" class="label">LLM calls</text>
  <path d="M250 620 H307" class="dataflow"/>
  <path d="M475 620 H532" class="dataflow"/>
  <path d="M395 586 C360 526 375 422 395 384" class="dataflow"/>

  <rect x="60" y="704" width="1080" height="34" rx="17" fill="#ffffff" stroke="#e2e8f0"/>
  <circle cx="92" cy="721" r="5" fill="#2563eb"/><text x="106" y="725" class="small">请求 / 控制流</text>
  <circle cx="224" cy="721" r="5" fill="#0891b2"/><text x="238" y="725" class="small">数据 / SQL 结果</text>
  <circle cx="378" cy="721" r="5" fill="#16a34a"/><text x="392" y="725" class="small">模型调用</text>
  <circle cx="498" cy="721" r="5" fill="#ea580c"/><text x="512" y="725" class="small">自修复重试</text>
  <circle cx="642" cy="721" r="5" fill="#7c3aed"/><text x="656" y="725" class="small">SSE 流式事件</text>
  <text x="925" y="725" class="small">Demo scope: local task store + read-only query sandbox</text>
</svg>
